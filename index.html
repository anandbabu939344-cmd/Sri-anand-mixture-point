      { id: 36, name: "జీడిపప్పు బటానీ", en: "Kaju Cashew Batani", cat: "బటానీ", emoji: "🌰", bg: "#fef08a", hot: true, variants: [{ label: "1 Plate", price: 80 }] },

      { id: 37, name: "టమోటా స్లైస్", en: "Tomato Slice", cat: "స్లైస్", emoji: "🍅", bg: "#ffe4e6", variants: [{ label: "1 Plate", price: 45 }] },
      { id: 38, name: "ఆలూ స్లైస్", en: "Aloo Slice", cat: "స్లైస్", emoji: "🥔", bg: "#ffedd5", variants: [{ label: "1 Plate", price: 45 }] },
      { id: 39, name: "ఎగ్ స్లైస్", en: "Egg Slice", cat: "స్లైస్", emoji: "🥚", bg: "#fef3c7", variants: [{ label: "1 Plate", price: 45 }] },
      { id: 40, name: "ఆనియన్ స్లైస్", en: "Onion Slice", cat: "స్లైస్", emoji: "🧅", bg: "#f3e8ff", variants: [{ label: "1 Plate", price: 45 }] },
      { id: 41, name: "కట్ బజ్జీ స్లైస్", en: "Cut Bajji Slice", cat: "స్లైస్", emoji: "🥪", bg: "#fef9c3", variants: [{ label: "1 Plate", price: 45 }] },
      { id: 42, name: "ఆనియన్ టమాటా స్లైస్", en: "Onion Tomato Slice", cat: "స్లైస్", emoji: "🥪", bg: "#ffe4e6", variants: [{ label: "1 Plate", price: 60 }] },
      { id: 43, name: "టమోటా ఎగ్ స్లైస్", en: "Tomato Egg Slice", cat: "స్లైస్", emoji: "🍳", bg: "#fef3c7", hot: true, variants: [{ label: "1 Plate", price: 60 }] },
      { id: 44, name: "టమోటా ఆలూ స్లైస్", en: "Tomato Aloo Slice", cat: "స్లైస్", emoji: "🥪", bg: "#ffedd5", variants: [{ label: "1 Plate", price: 60 }] },
      { id: 45, name: "ఆనియన్ ఎగ్ స్లైస్", en: "Onion Egg Slice", cat: "స్లైస్", emoji: "🍳", bg: "#ede9fe", variants: [{ label: "1 Plate", price: 60 }] }
    ];

    let activeCategory = 'All';
    let selectedVar = {};
    let cardQty = {};
    let cart = [];

    MENU.forEach(item => {
      selectedVar[item.id] = 0;
      cardQty[item.id] = 1;
    });

    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function selectVariant(id, idx) {
      selectedVar[id] = idx;
      renderProducts();
    }

    function changeCardQty(id, delta) {
      cardQty[id] = Math.max(1, (cardQty[id] || 1) + delta);
      document.getElementById('qty-' + id).innerText = cardQty[id];
    }

    function renderProducts() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('productGrid');
      const filtered = MENU.filter(item => {
        const matchCat = activeCategory === 'All' || item.cat === activeCategory;
        const matchSearch = !q || item.name.toLowerCase().includes(q) || item.en.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      grid.innerHTML = filtered.map(item => {
        const vIdx = selectedVar[item.id] || 0;
        const currentVar = item.variants[vIdx];
        const variantButtons = item.variants.map((v, idx) =>
          `<button class="var-btn ${idx === vIdx ? 'active' : ''}" onclick="selectVariant(${item.id}, ${idx})">${v.label}</button>`
        ).join('');

        return `<div class="card">
          <div class="card-visual" style="background:${item.bg};">
            ${item.hot ? '<span class="badge-hot">SPECIAL</span>' : ''}
            <div class="emoji-icon">${item.emoji}</div>
          </div>
          <div class="card-body">
            <div class="item-title">${item.name}</div>
            <div class="item-sub">${item.cat}</div>
            <div class="item-price">₹${currentVar.price}.00</div>
            <div class="variants">${variantButtons}</div>
            <div class="action-row">
              <div class="qty-box">
                <button onclick="changeCardQty(${item.id}, -1)">−</button>
                <span id="qty-${item.id}">${cardQty[item.id]}</span>
                <button onclick="changeCardQty(${item.id}, 1)">+</button>
              </div>
              <button class="add-btn" onclick="addToCart(${item.id})">ADD</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function addToCart(id) {
      const item = MENU.find(i => i.id === id);
      const vIdx = selectedVar[id] || 0;
      const variant = item.variants[vIdx];
      const qty = cardQty[id] || 1;
      const key = id + '-' + vIdx;

      const existing = cart.find(c => c.key === key);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ key, name: item.name, variant: variant.label, price: variant.price, qty });
      }
      cardQty[id] = 1;
      const qtyEl = document.getElementById('qty-' + id);
      if (qtyEl) qtyEl.innerText = 1;

      updateCartUI();
      showToast(item.name + ' (' + variant.label + ') added!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 1800);
    }

    function updateCartUI() {
      const totalItems = cart.reduce((s, c) => s + c.qty, 0);
      const totalAmount = cart.reduce((s, c) => s + c.price * c.qty, 0);

      document.getElementById('cartCount').innerText = totalItems;
      const bar = document.getElementById('bottomBar');
      if (totalItems > 0) {
        bar.style.display = 'flex';
        document.getElementById('barItems').innerText = totalItems + (totalItems > 1 ? ' Items' : ' Item');
        document.getElementById('barTotal').innerText = '₹' + totalAmount;
      } else {
        bar.style.display = 'none';
      }
      renderCartModal();
    }

    function updateCartItemQty(key, delta) {
      const idx = cart.findIndex(c => c.key === key);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartUI();
    }

    function renderCartModal() {
      const list = document.getElementById('cartItemsList');
      const statusBox = document.getElementById('deliveryStatus');
      const orderBtn = document.getElementById('waOrderBtn');

      if (cart.length === 0) {
        list.innerHTML = 'మీ కార్ట్ ఖాళీగా ఉంది.';
        statusBox.className = 'delivery-alert alert-warn';
        statusBox.innerText = 'కనీస ఆర్డర్ విలువ ₹' + MIN_ORDER + ' ఉండాలి.';
        orderBtn.disabled = true;
        return;
      }

      const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

      list.innerHTML = cart.map(c => `<div class="cart-item">
        <div>
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-meta">${c.variant} • ₹${c.price} × ${c.qty} = <strong>₹${c.price * c.qty}</strong></div>
        </div>
        <div class="cart-controls">
          <button onclick="updateCartItemQty('${c.key}', -1)">−</button>
          <span>${c.qty}</span>
          <button onclick="updateCartItemQty('${c.key}', 1)">+</button>
        </div>
      </div>`).join('') + `<div style="display:flex;justify-content:space-between;padding:12px 0 4px;font-size:17px;font-weight:800;">
        <span>మొత్తం బిల్ (Total Bill):</span>
        <span style="color:#0f6b38;">₹${total}</span>
      </div>`;

      if (total < MIN_ORDER) {
        statusBox.className = 'delivery-alert alert-warn';
        statusBox.innerText = '⚠️ Min Order ₹' + MIN_ORDER + '. ఆర్డర్ చేయడానికి ఇంకా ₹' + (MIN_ORDER - total) + ' విలువైన ఐటమ్స్ కలపండి.';
        orderBtn.disabled = true;
      } else if (total >= FREE_DELIVERY_MIN) {
        statusBox.className = 'delivery-alert alert-ok';
        statusBox.innerText = '🎉 మీకు 3 కి.మీ లోపు FREE Delivery వర్తిస్తుంది!';
        orderBtn.disabled = false;
      } else {
        statusBox.className = 'delivery-alert alert-ok';
        statusBox.innerText = '✅ ఆర్డర్ సిద్ధంగా ఉంది! (ఇంకా ₹' + (FREE_DELIVERY_MIN - total) + ' యాడ్ చేస్తే 3 కి.మీ లోపు FREE Delivery)';
        orderBtn.disabled = false;
      }
    }

    function openCart() {
      renderCartModal();
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function placeWhatsAppOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert("దయచేసి మీ పేరు, ఫోన్ నంబర్ మరియు అడ్రస్ నమోదు చేయండి.");
        return;
      }

      const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
      if (total < MIN_ORDER) return;

      const deliveryNote = total >= FREE_DELIVERY_MIN
        ? "FREE Delivery (Above ₹300, within 3 kms)"
        : "Standard Delivery (Below ₹300, within 3 kms)";

      const itemsText = cart.map((c, i) =>
        `${i + 1}. ${c.name} (${c.variant}) x ${c.qty} = ₹${c.price * c.qty}`
      ).join('\n');

      const message =
`*శ్రీ ఆనంద్ మిక్చర్ పాయింట్ - కొత్త ఆర్డర్* 🌶️🥣

*కస్టమర్ వివరాలు:*
పేరు: ${name}
ఫోన్: ${phone}
అడ్రస్: ${address}

*ఆర్డర్ ఐటమ్స్:*
${itemsText}

*మొత్తం బిల్: ₹${total}*
*డెలివరీ:* ${deliveryNote}`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
