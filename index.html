let activeCat = 'All';
let selectedVar = {};
let cart = {};
let distKm = null;
let uLat = null;
let uLon = null;
let paidClicked = false;

function setC(c, btn) {
  activeCat = c;
  document.querySelectorAll('.cat').forEach(x => x.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function setV(id, idx) {
  selectedVar[id] = idx;
  render();
}

function getQ(id, vi) {
  const key = id + '-' + vi;
  return cart[key] ? cart[key].q : 0;
}

function chg(id, delta) {
  const item = MENU.find(x => x.id === id);
  const vi = selectedVar[id] || 0;
  const v = item.vars[vi];
  const key = id + '-' + vi;
  const cur = cart[key] ? cart[key].q : 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) {
    delete cart[key];
  } else {
    cart[key] = { en: item.en, te: item.te, vl: v.l, p: v.p, q: next };
  }
  render();
  upd();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = MENU.filter(x => {
    const okCat = activeCat === 'All' || x.cat === activeCat;
    const okSearch = !q || x.en.toLowerCase().includes(q) || x.te.includes(q);
    return okCat && okSearch;
  });

  document.getElementById('grid').innerHTML = list.map(x => {
    const vi = selectedVar[x.id] || 0;
    const v = x.vars[vi];
    const qty = getQ(x.id, vi);
    const varBtns = x.vars.map((o, i) =>
      `<button class="vb ${i === vi ? 'on' : ''}" onclick="setV(${x.id}, ${i})">${o.l}</button>`
    ).join('');

    return `
      <div class="card">
        <div class="vis" style="background:${x.bg};">
          ${x.hot ? '<span class="hot">SPECIAL</span>' : ''}
          <span>${x.emoji}</span>
        </div>
        <div class="cb">
          <div class="en">${x.en}</div>
          <div class="te">${x.te}</div>
          <div class="pr">₹${v.p}</div>
          <div class="vars">${varBtns}</div>
          <div class="qbox">
            <button onclick="chg(${x.id}, -1)">−</button>
            <span>${qty}</span>
            <button onclick="chg(${x.id}, 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function calc() {
  const items = Object.values(cart);
  const sub = items.reduce((a, b) => a + b.p * b.q, 0);
  const cnt = items.reduce((a, b) => a + b.q, 0);
  let del = 0;
  if (distKm !== null) {
    if (sub >= 300 && distKm <= 3) {
      del = 0;
    } else if (distKm > 1) {
      del = 30;
    }
  }
  return { items, sub, cnt, del, tot: sub + del };
}

function upd() {
  const { cnt, sub } = calc();
  document.getElementById('cnt').innerText = cnt;
  const bar = document.getElementById('bbar');
  bar.style.display = cnt > 0 ? 'flex' : 'none';
  document.getElementById('bi').innerText = cnt + (cnt === 1 ? ' Item' : ' Items');
  document.getElementById('bt').innerText = '₹' + sub;
  renderC();
}

function getGPS() {
  const g = document.getElementById('gpsInfo');
  if (!navigator.geolocation) {
    g.innerText = 'GPS not supported on this browser.';
    return;
  }
  g.innerText = 'Detecting exact location...';
  navigator.geolocation.getCurrentPosition(pos => {
    uLat = pos.coords.latitude;
    uLon = pos.coords.longitude;
    const R = 6371;
    const dLat = (uLat - SHOP_LAT) * Math.PI / 180;
    const dLon = (uLon - SHOP_LON) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(SHOP_LAT * Math.PI / 180) * Math.cos(uLat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const straightKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    distKm = +(straightKm * 1.25).toFixed(2);
    g.innerText = '📍 One-Way Distance: ' + distKm + ' km from Opp. Phanindra Scan, Danavaipeta';
    renderC();
  }, () => {
    g.innerText = '⚠️ Please allow Location permission in browser settings.';
  }, { enableHighAccuracy: true });
}

function renderC() {
  const { items, sub, del, tot } = calc();
  const cl = document.getElementById('clist');
  const ds = document.getElementById('dstat');
  const ub = document.getElementById('ubtn');
  const wb = document.getElementById('wabtn');

  if (!items.length) {
    cl.innerHTML = '<p style="text-align:center;color:#64748b;padding:12px">Your cart is empty.</p>';
    ds.className = 'al w';
    ds.innerText = 'Minimum order ₹100 required';
    ub.disabled = true;
    wb.disabled = true;
    return;
  }

  cl.innerHTML = items.map(i =>
    `<div class="ci"><div><b>${i.en}</b> (${i.vl}) × ${i.q}</div><div><b>₹${i.p * i.q}</b></div></div>`
  ).join('') +
    `<div class="ci"><span>Items Total</span><b>₹${sub}</b></div>` +
    `<div class="ci"><span>Delivery Charge</span><b>${distKm === null ? 'Detect GPS first' : (del === 0 ? 'FREE (₹0)' : '₹' + del)}</b></div>` +
    `<div class="ci" style="font-size:16px"><b>Grand Total</b><b style="color:#0f6b38">₹${tot}</b></div>`;

  if (sub < 100) {
    ds.className = 'al w';
    ds.innerText = 'Add ₹' + (100 - sub) + ' more (Min Order ₹100)';
    ub.disabled = true;
    wb.disabled = true;
  } else if (distKm === null) {
    ds.className = 'al w';
    ds.innerText = 'Tap "Detect My Exact GPS Location" below to continue';
    ub.disabled = true;
    wb.disabled = true;
  } else {
    ds.className = 'al ok';
    ds.innerText = del === 0
      ? 'FREE Delivery applied (' + distKm + ' km)'
      : '₹30 Delivery added (Above 1 km: ' + distKm + ' km)';
    ub.disabled = false;
    ub.innerText = '💳 Pay ₹' + tot + ' via UPI (' + UPI + ')';
    wb.disabled = !paidClicked;
  }
}

function openC() {
  renderC();
  document.getElementById('ov').classList.add('open');
}

function closeC() {
  document.getElementById('ov').classList.remove('open');
}

function payUPI() {
  const { tot } = calc();
  paidClicked = true;
  document.getElementById('wabtn').disabled = false;
  window.location.href = 'upi://pay?pa=' + UPI + '&pn=Sri%20Anand%20Mixture%20Point&am=' + tot + '&cu=INR';
}

function sendWA() {
  const n = document.getElementById('cn').value.trim();
  const p = document.getElementById('cp').value.trim();
  const a = document.getElementById('ca').value.trim();
  if (!n || !p || !a) {
    alert('Please fill Customer Name, Mobile Number & Delivery Address');
    return;
  }
  const { items, sub, del, tot } = calc();
  const itemLines = items.map((x, i) =>
    (i + 1) + '. ' + x.en + ' (' + x.vl + ') x ' + x.q + ' = ₹' + (x.p * x.q)
  ).join('\n');

  const txt =
    '*Sri Anand Mixture Point - New Order*\n\n' +
    '*Name:* ' + n + '\n' +
    '*Phone:* ' + p + '\n' +
    '*Address:* ' + a + '\n' +
    '*GPS Distance:* ' + distKm + ' km (One-Way from Danavaipeta)\n' +
    '*Customer Map Pin:* https://maps.google.com/?q=' + uLat + ',' + uLon + '\n\n' +
    '*Items:*\n' + itemLines + '\n\n' +
    '*Items Total:* ₹' + sub + '\n' +
    '*Delivery:* ₹' + del + '\n' +
    '*Grand Total:* ₹' + tot + '\n' +
    '*Payment:* Paid via UPI (' + UPI + ') - Attaching Screenshot';

  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(txt), '_blank');
}

render();
</script>
