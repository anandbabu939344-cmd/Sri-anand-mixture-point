let activeCategory = "All";
let selectedVar = {};
let cart = {};
let distanceKm = null;
let userLat = null;
let userLon = null;

function setCategory(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll(".cat").forEach(el => el.classList.remove("on"));
  btn.classList.add("on");
  renderItems();
}

function selectVariant(id, idx) {
  selectedVar[id] = idx;
  renderItems();
}

function getItemQty(id, vIdx) {
  const key = id + "-" + vIdx;
  return cart[key] ? cart[key].qty : 0;
}

function updateQty(id, delta) {
  const item = MENU_ITEMS.find(x => x.id === id);
  const vIdx = selectedVar[id] || 0;
  const variant = item.vars[vIdx];
  const key = id + "-" + vIdx;
  const current = cart[key] ? cart[key].qty : 0;
  const next = Math.max(0, current + delta);

  if (next === 0) {
    delete cart[key];
  } else {
    cart[key] = { en: item.en, te: item.te, label: variant.l, price: variant.p, qty: next };
  }
  renderItems();
  refreshCartSummary();
}

function renderItems() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const grid = document.getElementById("productGrid");

  const filtered = MENU_ITEMS.filter(item => {
    const matchCat = activeCategory === "All" || item.cat === activeCategory;
    const matchQuery = !query || item.en.toLowerCase().includes(query) || item.te.includes(query);
    return matchCat && matchQuery;
  });

  grid.innerHTML = filtered.map(item => {
    const vIdx = selectedVar[item.id] || 0;
    const variant = item.vars[vIdx];
    const qty = getItemQty(item.id, vIdx);
    const varBtns = item.vars.map((v, i) =>
      `<button class="vb ${i === vIdx ? "on" : ""}" onclick="selectVariant(${item.id}, ${i})">${v.l}</button>`
    ).join("");

    return `
      <div class="card">
        <div class="vis" style="background:${item.bg}">
          ${item.hot ? '<span class="hot">SPECIAL</span>' : ""}
          <span>${item.icon}</span>
        </div>
        <div class="cb">
          <div class="en">${item.en}</div>
          <div class="te">${item.te}</div>
          <div class="pr">₹${variant.p}</div>
          <div class="vars">${varBtns}</div>
          <div class="qbox">
            <button onclick="updateQty(${item.id}, -1)">−</button>
            <span>${qty}</span>
            <button onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

  const list = Object.values(cart);
  const subTotal = list.reduce((sum, item) => sum + item.price * item.qty, 0);
  const totalCount = list.reduce((sum, item) => sum + item.qty, 0);
  let deliveryFee = 0;

  if (distanceKm !== null) {
    if (subTotal >= 300 && distanceKm <= 3) {
      deliveryFee = 0;
    } else if (distanceKm <= 1) {
      deliveryFee = 15;
    } else if (distanceKm <= 2) {
      deliveryFee = 30;
    } else {
      deliveryFee = Math.ceil(distanceKm) * 15;
    }
  }
  return { list, subTotal, totalCount, deliveryFee, grandTotal: subTotal + deliveryFee };
}

function refreshCartSummary() {
  const { totalCount, subTotal } = calculateTotals();
  document.getElementById("cartCount").innerText = totalCount;
  const bar = document.getElementById("bottomBar");
  bar.style.display = totalCount > 0 ? "flex" : "none";
  document.getElementById("barItems").innerText = totalCount + (totalCount === 1 ? " Item" : " Items");
  document.getElementById("barTotal").innerText = "₹" + subTotal;
  renderCartModal();
}

function detectGPS() {
  const status = document.getElementById("gpsStatus");
  if (!navigator.geolocation) {
    status.innerText = "GPS not supported on this browser.";
    return;
  }
  status.innerText = "Detecting exact GPS location...";
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    const R = 6371;
    const dLat = (userLat - SHOP_LAT) * Math.PI / 180;
    const dLon = (userLon - SHOP_LON) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(SHOP_LAT * Math.PI / 180) * Math.cos(userLat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const exactKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    distanceKm = Math.round(exactKm * 100) / 100;
    const meters = Math.round(distanceKm * 1000);
    status.innerText = distanceKm < 1
      ? `📍 Distance: ${meters} meters (${distanceKm} km) from Danavaipeta`
      : `📍 Distance: ${distanceKm} km from Danavaipeta`;
    renderCartModal();
  }, () => {
    status.innerText = "⚠️ Please turn ON Location/GPS and allow permission.";
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function renderCartModal() {
  const { list, subTotal, deliveryFee, grandTotal } = calculateTotals();
  const cartList = document.getElementById("cartList");
  const alertBox = document.getElementById("deliveryAlert");
  const upiBtn = document.getElementById("upiBtn");
  const paidLabel = document.getElementById("paidLabel");

  if (list.length === 0) {
    cartList.innerHTML = '<p style="text-align:center;color:#64748b;padding:12px;">Your cart is empty.</p>';
    alertBox.className = "al w";
    alertBox.innerText = "Minimum order value is ₹100";
    upiBtn.disabled = true;
    paidLabel.style.opacity = "0.5";
    paidLabel.style.pointerEvents = "none";
    toggleConfirmBtn();
    return;
  }

  cartList.innerHTML = list.map(i => `
    <div class="ci">
      <div><b>${i.en}</b> (${i.label}) × ${i.qty}</div>
      <div><b>₹${i.price * i.qty}</b></div>
    </div>
  `).join("") + `
    <div class="ci"><span>Items Total</span><b>₹${subTotal}</b></div>
    <div class="ci"><span>Delivery Charge</span><b>${distanceKm === null ? "Detect GPS first" : (deliveryFee === 0 ? "FREE (₹0)" : "₹" + deliveryFee)}</b></div>
    <div class="ci" style="font-size:16px"><b>Grand Total</b><b style="color:#0f6b38">₹${grandTotal}</b></div>
  `;

  if (subTotal < 100) {
    alertBox.className = "al w";
    alertBox.innerText = `Add ₹${100 - subTotal} more (Minimum order ₹100)`;
    upiBtn.disabled = true;
    paidLabel.style.opacity = "0.5";
    paidLabel.style.pointerEvents = "none";
  } else if (distanceKm === null) {
    alertBox.className = "al w";
    alertBox.innerText = 'Tap "Detect My Exact GPS Location" below to continue';
    upiBtn.disabled = true;
    paidLabel.style.opacity = "0.5";
    paidLabel.style.pointerEvents = "none";
  } else {
    alertBox.className = "al ok";
    alertBox.innerText = deliveryFee === 0
      ? `🎉 FREE Delivery applied (${distanceKm} km)`
      : `Delivery Charge: ₹${deliveryFee} (${distanceKm} km from shop)`;
    upiBtn.disabled = false;
    upiBtn.innerText = `💳 Pay ₹${grandTotal} via UPI (${UPI_ID})`;
    paidLabel.style.opacity = "1";
    paidLabel.style.pointerEvents = "auto";
  }
  toggleConfirmBtn();
}

function toggleConfirmBtn() {
  const checked = document.getElementById("paidCheck").checked;
  const upiEnabled = !document.getElementById("upiBtn").disabled;
  document.getElementById("waBtn").disabled = !(checked && upiEnabled);
}

function openCart() {
  renderCartModal();
  document.getElementById("cartModal").classList.add("open");
}

function closeCart() {
  document.getElementById("cartModal").classList.remove("open");
}

function payWithUPI() {
  const { grandTotal } = calculateTotals();
  window.location.href = `upi://pay?pa=${UPI_ID}&pn=Sri%20Anand%20Mixture%20Point&am=${grandTotal}&cu=INR`;
}

function sendWhatsApp() {
  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const addr = document.getElementById("custAddr").value.trim();
  if (!name || !phone || !addr) {
    alert("Please enter Customer Name, Mobile Number & Address.");
    return;
  }
  const { list, subTotal, deliveryFee, grandTotal } = calculateTotals();
  const itemLines = list.map((x, idx) => `${idx + 1}. ${x.en} (${x.label}) x ${x.qty} = ₹${x.price * x.qty}`).join("\n");
  const msg =
`*Sri Anand Mixture Point - New Order*

*Name:* ${name}
*Phone:* ${phone}
*Address:* ${addr}
*One-Way Distance:* ${distanceKm} km
*Google Maps Pin:* https://maps.google.com/?q=${userLat},${userLon}

*Order Items:*
${itemLines}

*Items Total:* ₹${subTotal}
*Delivery Fee:* ₹${deliveryFee}
*Grand Total:* ₹${grandTotal}
*Payment:* Paid via UPI (${UPI_ID})`;

  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

renderItems();
