let cat = 'All', sv = {}, cart = {}, distKm = null, uLat = null, uLon = null;

function setC(c, b) {
  cat = c;
  document.querySelectorAll('.cat').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  render();
}
function setV(id, i) { sv[id] = i; render(); }
function getQ(id, vi) { return cart[id + '-' + vi] ? cart[id + '-' + vi].q : 0; }

function chg(id, d) {
  const it = M.find(x => x.id === id);
  const vi = sv[id] || 0;
  const k = id + '-' + vi;
  const v = it.v[vi];
  const cur = cart[k] ? cart[k].q : 0;
  const nq = Math.max(0, cur + d);
  if (nq === 0) delete cart[k];
  else cart[k] = { en: it.en, te: it.te, vl: v.l, p: v.p, q: nq };
  render();
  upd();
}

function render() {
  const s = document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('grid').innerHTML = M.filter(x =>
    (cat === 'All' || x.c === cat) && (!s || x.en.toLowerCase().includes(s) || x.te.includes(s))
  ).map(x => {
    const vi = sv[x.id] || 0;
    const v = x.v[vi];
    const q = getQ(x.id, vi);
    const vBtns = x.v.map((o, i) =>
      `<button class="vb ${i === vi ? 'on' : ''}" onclick="setV(${x.id},${i})">${o.l}</button>`
    ).join('');
    return `<div class="card">
      <div class="vis" style="background:${x.bg}">${x.h ? '<span class="hot">SPECIAL</span>' : ''}${x.e}</div>
      <div class="cb">
        <div class="en">${x.en}</div>
        <div class="te">${x.te}</div>
        <div class="pr">₹${v.p}</div>
        <div class="vars">${vBtns}</div>
        <div class="qbox">
          <button onclick="chg(${x.id},-1)">−</button>
          <span>${q}</span>
          <button onclick="chg(${x.id},1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function calc() {
  const items = Object.values(cart);
  const sub = items.reduce((a, b) => a + b.p * b.q, 0);
  const cnt = items.reduce((a, b) => a + b.q, 0);
  let del = 0;
  if (distKm !== null) {
    if (sub >= 300 && distKm <= 3) del = 0;
    else if (distKm <= 1) del = 15;
    else if (distKm <= 2) del = 30;
    else del = 45;
  }
  return { items, sub, cnt, del, tot: sub + del };
}

function upd() {
  const { cnt, sub } = calc();
  document.getElementById('cnt').innerText = cnt;
  const b = document.getElementById('bbar');
  b.style.display = cnt > 0 ? 'flex' : 'none';
  document.getElementById('bi').innerText = cnt + ' Items';
  document.getElementById('bt').innerText = '₹' + sub;
  renderC();
}

function getGPS() {
  const g = document.getElementById('gpsInfo');
  if (!navigator.geolocation) { g.innerText = 'GPS not supported'; return; }
  g.innerText = 'Detecting exact location...';
  navigator.geolocation.getCurrentPosition(pos => {
    uLat = pos.coords.latitude;
    uLon = pos.coords.longitude;
    const R = 6371;
    const dLat = (uLat - SHOP_LAT) * Math.PI / 180;
    const dLon = (uLon - SHOP_LON) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(SHOP_LAT * Math.PI / 180) * Math.cos(uLat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    distKm = +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(2);
    const m = Math.round(distKm * 1000);
    g.innerText = `📍 Distance: ${m < 1000 ? m + ' meters' : distKm + ' km'} from Danavaipeta`;
    renderC();
  }, () => {
    g.innerText = '⚠️ Please allow Location permission in browser settings.';
  }, { enableHighAccuracy: true });
}

function renderC() {
  const { items, sub, del, tot } = calc();
  const cl = document.getElementById('clist');
  const ds = document.getElementById('dstat');
  const wb = document.getElementById('wabtn');
  document.getElementById('qrAmt').innerText = '₹' + tot;
  if (!items.length) {
    cl.innerHTML = '<p style="text-align:center;color:#64748b;padding:10px">Cart is empty</p>';
    ds.className = 'al w';
    ds.innerText = 'Minimum order ₹100 required';
    wb.disabled = true;
    return;
  }
  cl.innerHTML = items.map(i => `<div class="ci"><div><b>${i.en}</b> (${i.vl}) × ${i.q}</div><div><b>₹${i.p * i.q}</b></div></div>`).join('') +
    `<div class="ci"><span>Items Total</span><b>₹${sub}</b></div>` +
    `<div class="ci"><span>Delivery Charge</span><b>${distKm === null ? 'Detect GPS first' : (del === 0 ? 'FREE (₹0)' : '₹' + del)}</b></div>` +
    `<div class="ci" style="font-size:16px"><b>Grand Total</b><b style="color:#0f6b38">₹${tot}</b></div>`;
  const utrVal = document.getElementById('utr').value.trim();
  const validUtr = /^\d{12}$/.test(utrVal);
  if (sub < 100) {
    ds.className = 'al w';
    ds.innerText = `Add ₹${100 - sub} more (Min Order ₹100)`;
    wb.disabled = true;
  } else if (distKm === null) {
    ds.className = 'al w';
    ds.innerText = 'Tap "Detect My Exact GPS Location" below to continue';
    wb.disabled = true;
  } else {
    ds.className = 'al ok';
    ds.innerText = del === 0 ? `FREE Delivery applied (${distKm} km)` : `Delivery ₹${del} applied (${distKm} km)`;
    wb.disabled = !validUtr;
  }
}

function openC() { renderC(); document.getElementById('ov').classList.add('open'); }
function closeC() { document.getElementById('ov').classList.remove('open'); }

function sendWA() {
  const n = document.getElementById('cn').value.trim();
  const p = document.getElementById('cp').value.trim();
  const a = document.getElementById('ca').value.trim();
  const utr = document.getElementById('utr').value.trim();
  if (!n || !p || !a) { alert('Please fill Name, Mobile & Address'); return; }
  if (!/^\d{12}$/.test(utr)) { alert('Please enter valid 12-digit UTR number'); return; }
  const { items, sub, del, tot } = calc();
  const txt = `*Sri Anand Mixture Point - New Order*\n\n*Name:* ${n}\n*Phone:* ${p}\n*Address:* ${a}\n*GPS Distance:* ${distKm} km (One-Way)\n*Map Pin:* https://maps.google.com/?q=${uLat},${uLon}\n\n*Items:*\n${items.map((x, i) => `${i + 1}. ${x.en} (${x.vl}) x ${x.q} = ₹${x.p * x.q}`).join('\n')}\n\n*Items Total:* ₹${sub}\n*Delivery:* ₹${del}\n*Grand Total:* ₹${tot}\n*BharatPe UTR:* ${utr} (Attaching Screenshot)`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(txt)}`, '_blank');
}

render();
</script>
